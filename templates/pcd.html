<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Aviator Acessivel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0f1a;color:#fff;font-family:Arial;height:100vh;display:flex;flex-direction:column;overflow:hidden;font-size:14px}
.top{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#111827;border-bottom:2px solid #1e293b;flex-shrink:0}
.top h1{font-size:18px;color:#22d3ee}
.btn{padding:10px 20px;border:2px solid #334155;border-radius:8px;background:#1e293b;color:#fff;cursor:pointer;font-size:14px;font-weight:700;min-height:44px}
.btn:hover{background:#334155}
.btn.on{background:#0d9488;border-color:#14b8a6}
.btn.go{background:#16a34a;border-color:#22c55e;font-size:18px;padding:12px 30px}
.btn.go:hover{background:#15803d}
.main{display:flex;flex:1;min-height:0}
.chart-area{flex:1;position:relative;background:#080c14}
canvas{display:block;width:100%;height:100%}
.panel{width:220px;background:#111827;border-left:2px solid #1e293b;display:flex;flex-direction:column;padding:10px;gap:10px;overflow-y:auto}
.alert-box{padding:14px;border-radius:10px;text-align:center;font-size:22px;font-weight:900;min-height:80px;display:flex;align-items:center;justify-content:center;border:3px solid transparent;transition:all .3s}
.alert-wait{background:#1e293b;color:#64748b;border-color:#334155}
.alert-romp{background:#052e16;color:#22c55e;border-color:#22c55e;animation:pulse .8s infinite}
.alert-pull{background:#1e3a5f;color:#60a5fa;border-color:#3b82f6;animation:pulse 1.2s infinite}
.alert-go{background:#500724;color:#f9a8d4;border-color:#ec4899;animation:pulse .5s infinite;font-size:28px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.info-box{background:#1e293b;border-radius:8px;padding:8px 12px;text-align:center}
.info-val{font-size:24px;font-weight:900}
.info-lbl{font-size:10px;color:#94a3b8}
.last-row{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.last-dot{width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#fff}
.line-item{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;background:#1e293b;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600}
.line-item .x{color:#ef4444;font-size:16px;cursor:pointer;padding:4px}
</style>
</head>
<body>

<div class="top">
  <h1>AVIATOR PCD</h1>
  <button class="btn" id="btnLine">📏 TRAÇAR LINHA</button>
  <button class="btn" id="btnClear">🗑 LIMPAR LINHAS</button>
  <button class="btn" id="btnConectar" style="background:#16a34a;border-color:#22c55e">🔌 CONECTAR PAINEL</button>
  <span style="margin-left:auto;font-size:12px;color:#94a3b8">🟢 Rompimento → 🔵 Pullback → 🩷 ENTRAR</span>
</div>

<div class="main">
  <div class="chart-area" id="wrap">
    <canvas id="chart"></canvas>
  </div>

  <div class="panel">
    <div class="alert-box alert-wait" id="alertBox">AGUARDANDO</div>

    <div class="info-box">
      <div class="info-val" id="lastVal">---</div>
      <div class="info-lbl">ULTIMA VELA</div>
    </div>
    <div class="info-box">
      <div class="info-val" id="countVal">0</div>
      <div class="info-lbl">TOTAL DE VELAS</div>
    </div>
    <div class="info-box">
      <div class="info-val" id="aboveVal">0%</div>
      <div class="info-lbl">ACIMA DE 2X</div>
    </div>

    <div style="font-weight:700;color:#94a3b8">LINHAS TRAÇADAS</div>
    <div id="lineList"></div>

    <div style="font-weight:700;color:#94a3b8">ULTIMAS</div>
    <div class="last-row" id="lastRow"></div>

    <button class="btn go" id="btnGo">▶ SIMULAR</button>
  </div>
</div>

<script>
const canvas = document.getElementById('chart');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('chart-area');
const dpr = Math.min(window.devicePixelRatio || 1, 2);

let candles = [];
let lines = [];
let addingLine = false;
let dragging = null;
let dragY = 0;
let dragOrig = 0;
let alertState = 'wait'; // wait | romp | pull | go

const M = { top: 15, right: 10, bottom: 25, left: 10 };

function resize() {
  canvas.width = wrap.clientWidth * dpr;
  canvas.height = wrap.clientHeight * dpr;
  canvas.style.width = wrap.clientWidth + 'px';
  canvas.style.height = wrap.clientHeight + 'px';
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(dpr, dpr);
  draw();
}
window.addEventListener('resize', resize);

function addCandle(val) {
  candles.push({ h: val, t: Date.now() });
  if (candles.length > 200) candles.shift();

  // Check line events
  checkLineEvents(val);

  updatePanel();
  draw();
}

function checkLineEvents(val) {
  if (lines.length === 0 || candles.length < 2) return;

  const prev = candles[candles.length - 2].h;

  for (const ln of lines) {
    // Breakout: previous candle BELOW line, current candle ABOVE line
    if (prev < ln.val && val >= ln.val && alertState !== 'pull') {
      alertState = 'romp';
      showAlert('🔺 ROMPIMENTO!', 'alert-romp');
      playBeep(600, 0.15);
      ln.crossed = true;
      ln.crossTime = Date.now();
    }
    // Pullback: was above, now comes back near the line (within 15%)
    if (ln.crossed && alertState === 'romp') {
      const above = candles.filter(c => c.h >= ln.val).length;
      if (above >= 2 && val < ln.val * 1.15 && val >= ln.val * 0.85) {
        alertState = 'pull';
        showAlert('🔵 PULLBACK! ESPERAR', 'alert-pull');
        playBeep(800, 0.2);
      }
    }
    // GO signal: after pullback, next candle above the line
    if (ln.crossed && alertState === 'pull' && val >= ln.val) {
      alertState = 'go';
      showAlert('🩷 ENTRA NA PROXIMA!', 'alert-go');
      playBeep(1000, 0.3);
      setTimeout(function() { playBeep(1200, 0.3); }, 300);
      // Reset after 3 candles
      setTimeout(function() {
        alertState = 'wait';
        showAlert('AGUARDANDO', 'alert-wait');
        ln.crossed = false;
      }, 15000);
    }
  }
}

function showAlert(msg, cls) {
  const el = document.getElementById('alertBox');
  el.textContent = msg;
  el.className = 'alert-box ' + cls;
}

function playBeep(freq, dur) {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.connect(gain);
    gain.connect(ac.destination);
    osc.frequency.value = freq;
    osc.type = 'sine';
    gain.gain.value = 0.3;
    osc.start();
    osc.stop(ac.currentTime + dur);
  } catch (e) {}
}

function updatePanel() {
  const n = candles.length;
  if (n === 0) return;

  const last = candles[n - 1].h;
  document.getElementById('lastVal').textContent = last.toFixed(2) + 'x';
  document.getElementById('lastVal').style.color = last >= 10 ? '#ec4899' : last >= 2 ? '#22c55e' : '#ef4444';
  document.getElementById('countVal').textContent = n;

  let above2 = 0;
  for (const c of candles) if (c.h >= 2) above2++;
  document.getElementById('aboveVal').textContent = ((above2 / n) * 100).toFixed(0) + '%';

  // Last dots
  const last20 = candles.slice(-20).reverse();
  document.getElementById('lastRow').innerHTML = last20.map(c => {
    const bg = c.h >= 10 ? '#ec4899' : c.h >= 2 ? '#22c55e' : '#ef4444';
    return '<div class="last-dot" style="background:' + bg + '">' + c.h.toFixed(1) + '</div>';
  }).join('');
}

function draw() {
  const w = wrap.clientWidth;
  const h = wrap.clientHeight;
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);

  if (candles.length < 1) { ctx.restore(); return; }

  let maxVal = 5;
  for (const c of candles) if (c.h > maxVal) maxVal = c.h;
  maxVal = Math.max(maxVal, 5);
  if (maxVal <= 2) maxVal = 2; else if (maxVal <= 5) maxVal = 5; else if (maxVal <= 10) maxVal = 10;
  else maxVal = Math.ceil(maxVal / 10) * 10;

  const chartH = h - M.top - M.bottom;
  function y(v) { return M.top + chartH * (1 - v / maxVal); }

  // Zone backgrounds
  const y2 = y(2), y10 = y(10);
  ctx.fillStyle = 'rgba(239,68,68,0.05)';
  ctx.fillRect(0, M.top, w, y2 - M.top);
  ctx.setLineDash([4, 8]);
  ctx.strokeStyle = 'rgba(239,68,68,0.3)';
  ctx.beginPath(); ctx.moveTo(0, y2); ctx.lineTo(w, y2); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#ef4444'; ctx.font = 'bold 14px Arial'; ctx.fillText('2.00x', 10, y2 - 6);

  if (y10 > M.top) {
    ctx.fillStyle = 'rgba(236,72,153,0.05)';
    ctx.fillRect(0, y10, w, h - y10);
    ctx.setLineDash([4, 8]);
    ctx.strokeStyle = 'rgba(236,72,153,0.3)';
    ctx.beginPath(); ctx.moveTo(0, y10); ctx.lineTo(w, y10); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#ec4899'; ctx.font = 'bold 14px Arial'; ctx.fillText('10.00x', 10, y10 - 6);
  }

  // Candles
  const n = candles.length;
  const barW = Math.max(2, (w - M.left - M.right) / n * 0.6);
  for (let i = 0; i < n; i++) {
    const cx = M.left + (w - M.left - M.right) * (i / Math.max(n - 1, 1));
    const topY = y(candles[i].h);
    const botY = y(1);
    const col = candles[i].h >= 10 ? '#ec4899' : candles[i].h >= 2 ? '#22c55e' : '#ef4444';

    ctx.fillStyle = col;
    ctx.globalAlpha = 0.7;
    ctx.fillRect(cx - barW / 2, topY, barW, botY - topY);
    ctx.globalAlpha = 1;

    // Bright dot at top
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(cx, topY, candles[i].h >= 10 ? 4 : candles[i].h >= 5 ? 3 : 2, 0, Math.PI * 2);
    ctx.fill();
  }

  // Lines
  for (const ln of lines) {
    const ly = y(ln.val);
    ctx.strokeStyle = ln.color;
    ctx.lineWidth = 3;
    ctx.setLineDash([8, 4]);
    ctx.beginPath(); ctx.moveTo(0, ly); ctx.lineTo(w, ly); ctx.stroke();
    ctx.setLineDash([]);

    // Big label
    ctx.fillStyle = ln.color;
    ctx.font = 'bold 16px Arial';
    ctx.fillText(ln.val.toFixed(2) + 'x', w - 90, ly - 6);
  }

  ctx.restore();

  // Update line list in panel
  document.getElementById('lineList').innerHTML = lines.map((l, i) =>
    '<div class="line-item" style="border-left:4px solid ' + l.color + ';padding-left:8px" onclick="editLine(' + i + ')">' +
    l.val.toFixed(2) + 'x' +
    '<span class="x" onclick="event.stopPropagation();delLine(' + i + ')">✕</span></div>'
  ).join('');
}

function editLine(i) {
  const v = parseFloat(prompt('Novo valor:', lines[i].val.toFixed(2)));
  if (!isNaN(v) && v > 0) { lines[i].val = v; lines[i].crossed = false; alertState = 'wait'; showAlert('AGUARDANDO', 'alert-wait'); draw(); }
}
function delLine(i) { lines.splice(i, 1); alertState = 'wait'; showAlert('AGUARDANDO', 'alert-wait'); draw(); }

// Mouse
wrap.addEventListener('mousemove', function(e) {
  const my = e.clientY - wrap.getBoundingClientRect().top;
  if (candles.length < 1) return;

  if (dragging) {
    const maxVal = getMaxVal();
    const chartH = wrap.clientHeight - M.top - M.bottom;
    dragging.val = Math.max(0.01, dragOrig - ((my - dragY) / chartH) * maxVal);
    draw();
    return;
  }
});

wrap.addEventListener('mouseup', function() { dragging = null; });

wrap.addEventListener('mousedown', function(e) {
  const my = e.clientY - wrap.getBoundingClientRect().top;
  if (candles.length < 1 && !addingLine) return;

  if (addingLine) {
    const maxVal = getMaxVal();
    const chartH = wrap.clientHeight - M.top - M.bottom;
    const val = maxVal * (1 - (my - M.top) / chartH);
    const colors = ['#f59e0b', '#3b82f6', '#22c55e', '#ec4899', '#06b6d4'];
    lines.push({ val: Math.max(1.01, val), color: colors[lines.length % colors.length], crossed: false });
    addingLine = false;
    document.getElementById('btnLine').classList.remove('on');
    alertState = 'wait';
    showAlert('AGUARDANDO ROMPIMENTO', 'alert-wait');
    draw();
    return;
  }

  if (candles.length < 1) return;
  const maxVal = getMaxVal();
  const chartH = wrap.clientHeight - M.top - M.bottom;
  for (let i = lines.length - 1; i >= 0; i--) {
    const ly = M.top + chartH * (1 - lines[i].val / maxVal);
    if (Math.abs(my - ly) < 15) {
      dragging = lines[i];
      dragY = my;
      dragOrig = lines[i].val;
      return;
    }
  }
});

wrap.addEventListener('dblclick', function(e) {
  const my = e.clientY - wrap.getBoundingClientRect().top;
  if (candles.length < 1) return;
  const maxVal = getMaxVal();
  const chartH = wrap.clientHeight - M.top - M.bottom;
  for (let i = lines.length - 1; i >= 0; i--) {
    const ly = M.top + chartH * (1 - lines[i].val / maxVal);
    if (Math.abs(my - ly) < 15) { lines.splice(i, 1); alertState = 'wait'; showAlert('AGUARDANDO', 'alert-wait'); draw(); break; }
  }
});

function getMaxVal() {
  let max = 5;
  for (const c of candles) if (c.h > max) max = c.h;
  max = Math.max(max, 5);
  if (max <= 2) max = 2; else if (max <= 5) max = 5; else if (max <= 10) max = 10;
  else max = Math.ceil(max / 10) * 10;
  return max;
}

// Buttons
document.getElementById('btnLine').onclick = function() {
  addingLine = !addingLine; this.classList.toggle('on');
};
document.getElementById('btnClear').onclick = function() {
  lines = []; alertState = 'wait'; showAlert('AGUARDANDO', 'alert-wait'); draw();
};
document.getElementById('btnGo').onclick = function() {
  const b = this;
  if (b.dataset.r === '1') {
    b.dataset.r = '0'; b.textContent = '▶ SIMULAR';
    if (b._i) clearInterval(b._i);
    return;
  }
  b.dataset.r = '1'; b.textContent = '■ PARAR';
  b._i = setInterval(function() {
    const r = Math.random();
    const val = r < .45 ? 1 + Math.random() : r < .72 ? 2 + Math.random() * 3 : r < .87 ? 5 + Math.random() * 10 : r < .95 ? 15 + Math.random() * 35 : r < .985 ? 50 + Math.random() * 100 : 150 + Math.random() * 350;
    addCandle(val);
  }, 2000);
};

// ===== CONEXAO COM PAINEL MARKIN =====
var API_URL = window.location.origin || 'https://painel-aviator.onrender.com';
var conectadoPainel = false;
var painelTimer = null;
var ultimoRoundId = null;
var painelCasas = [];

document.getElementById('btnConectar').onclick = function() {
  if (conectadoPainel) {
    desconectarPainel();
    return;
  }
  conectarPainel();
};

async function conectarPainel() {
  try {
    var resp = await fetch(API_URL + '/api/casas');
    var data = await resp.json();
    painelCasas = data.casas || [];

    if (painelCasas.length === 0) {
      alert('Nenhuma casa encontrada no painel. A extensao esta capturando?');
      return;
    }

    var casa = painelCasas[0];
    // Try to find a casa from the extension
    for (var i = 0; i < painelCasas.length; i++) {
      if (painelCasas[i].indexOf('sortenabet') >= 0 || painelCasas[i].indexOf('SorteNaBet') >= 0 || painelCasas[i].indexOf('ws-') >= 0) {
        casa = painelCasas[i];
        break;
      }
    }

    // Load recent candles
    var resp2 = await fetch(API_URL + '/api/rounds?limit=50&casa=' + encodeURIComponent(casa));
    var d2 = await resp2.json();
    var rows = d2.rows || [];
    rows.reverse();
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      var rodada = String(r.round_id || '');
      if (rodada !== ultimoRoundId) {
        addCandle(parseFloat(r.multiplier));
        ultimoRoundId = rodada;
      }
    }

    conectadoPainel = true;
    var btn = document.getElementById('btnConectar');
    btn.textContent = '🔌 CONECTADO';
    btn.style.background = '#0d9488';
    btn.style.borderColor = '#14b8a6';

    // Poll every 2s
    painelTimer = setInterval(async function() {
      try {
        var resp3 = await fetch(API_URL + '/api/rounds?limit=5&casa=' + encodeURIComponent(casa));
        var d3 = await resp3.json();
        var rows3 = d3.rows || [];
        for (var i = rows3.length - 1; i >= 0; i--) {
          var r3 = rows3[i];
          var rodada3 = String(r3.round_id || '');
          if (rodada3 !== ultimoRoundId) {
            addCandle(parseFloat(r3.multiplier));
            ultimoRoundId = rodada3;
          }
        }
      } catch(e) {}
    }, 2500);

  } catch(e) {
    alert('Erro ao conectar: ' + e.message);
  }
}

function desconectarPainel() {
  conectadoPainel = false;
  if (painelTimer) { clearInterval(painelTimer); painelTimer = null; }
  var btn = document.getElementById('btnConectar');
  btn.textContent = '🔌 CONECTAR PAINEL';
  btn.style.background = '#16a34a';
  btn.style.borderColor = '#22c55e';
}

resize();
</script>
</body>
</html>
